<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app-container" id="app">
    <header class="app-header">
      <h1 class="app-title">Task Master</h1>
      <p id="task-counter" class="task-counter">0 tasks remaining</p>
      </header>


  <form id="todo-form" class="todo-form">
      <input 
        type="text" 
        id="todo-input" 
        class="todo-input" 
        placeholder="What needs to be done?" 
        autocomplete="off"
        required
      >

      <button type="submit" id="add-btn" class="btn btn-primary">Add Task</button>
      
    </form>


  </main>

  

  <script src="script.js"></script>
</body>
</html>
